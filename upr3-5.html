<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css">
 
    <script>
        document.addEventListener('DOMContentLoaded', function(event){
            const btn = document.querySelector('.btn-primary');
            const field = document.querySelector('#a1');
            btn.addEventListener('click', (e) => {
                field.style.padding = (Number.parseFloat(getComputedStyle(field).paddingTop)                + Number.parseFloat(field.value) + 'px ')
                                    + (Number.parseFloat(getComputedStyle(field).paddingRight)
                                    + Number.parseFloat(field.value) + 'px ')
                                    + (Number.parseFloat(getComputedStyle(field).paddingBottom)
                                    + Number.parseFloat(field.value) + 'px ')
                                    + (Number.parseFloat(getComputedStyle(field).paddingLeft)
                                    + Number.parseFloat(field.value) + 'px ');
                                    // 18px 22px 18px 22px
            });
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="form-group form-inline m-3">
              <label for="a1">Добави още Падинг</label>
              <input type="text" class="form-control mx-3" id="a1" placeholder="Падинг">
              <button type="button" class="btn btn-primary">Добави</button>
            </div>
        </div>
    </div>
</body>
</html>
