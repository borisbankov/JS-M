<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        .media{
            position:relative;
 
        }
        .media-object{
            border-radius:5px;
        }
        .close{
            position:absolute;
            top:0;
            right:5px;
        }
    </style>
</head>
<body>
 
    <div class="container" style="margin-top:50px">
        <div class="row">
            <div class="col-md-6 col-lg-6">
                <ul class="media-list main-list">
                  <li class="media border-info card">
                    <a class="pull-left" href="#">
                      <img class="media-object" src="http://placehold.co/500x100" alt="...">
                    </a>
                    <div class="card-body">
                      <h4 class="card-heading">Lorem ipsum dolor asit amet 1</h4>
                      <p class="by-author">By John Doe</p>
                    </div>
                    <a href="#" class="close">x</a>
                  </li>
                  <li class="media border-info card">
                    <a class="pull-left" href="#">
                      <img class="media-object" src="http://placehold.co/500x100" alt="...">
                    </a>
                    <div class="card-body">
                      <h4 class="card-heading">Lorem ipsum dolor asit amet 2</h4>
                      <p class="by-author">By Jane Doe</p>
                    </div>
                    <a href="#" class="close">x</a>
                  </li>
                  <li class="media border-info card">
                    <a class="pull-left" href="#">
                      <img class="media-object" src="http://placehold.co/500x100" alt="...">
                    </a>
                    <div class="card-body">
                      <h4 class="card-heading">Lorem ipsum dolor asit amet 3</h4>
                      <p class="by-author">By Johnson Doe</p>
                    </div>
                    <a href="#" class="close">x</a>
                  </li>
                </ul>
            </div>
            <div class="col-md-3 offset-2">
              <input type="button" value="Add Message" class="btn btn-info">
              <div class="mt-2 alert alert-info p-2 d-none" id="messages">
                
              </div>
          </div>
        </div>
    </div>
  <script>
    
    const btn = document.querySelector('.btn');
    const box = document.querySelector('#messages');
    const arr = document.querySelectorAll('.media');

    const closeBtns = document.querySelectorAll('.close');
    // let close = arr[0].querySelector('.close');
    // close.addEventListener('click', (e) => { e.target.parentNode.remove(); });

    closeBtns.forEach(item => {
      item.addEventListener('click', (e) => {
        e.target.parentNode.remove(); 
      });
    });

    btn.addEventListener('click', (e) => {
        const copy = arr[0].cloneNode(true);
        document.querySelector('.media-list').append(copy);
        box.innerText = isNaN(parseInt(box.innerText)) ? 1 : parseInt(box.innerText) + 1;
    });
  </script>
</body>
</html>
