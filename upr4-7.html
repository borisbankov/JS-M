<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body style="position: relative;">
	<span style="position: absolute; top: 0px; left: 0px">moooove</span>
	<script>
		const span = document.querySelector('span');
		document.addEventListener('keydown', (e) => {
			if(e.code == 'KeyA'){
				span.style.left = parseInt(getComputedStyle(span).left) - 10 + 'px';
			}
			if(e.code == 'KeyD'){
				span.style.left = parseInt(getComputedStyle(span).left) + 10 + 'px';
			}
			if(e.code == 'KeyW'){
				span.style.top = parseInt(getComputedStyle(span).top) - 10 + 'px';
			}
			if(e.code == 'KeyS'){
				span.style.top = parseInt(getComputedStyle(span).top) + 10 + 'px';
			}

		});
	</script>
</body>
</html>
