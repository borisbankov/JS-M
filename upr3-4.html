<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <script>
    document.addEventListener('DOMContentLoaded', () => {
       const rows = document.querySelector('#a1');
       const cols = document.querySelector('#b1');
       const btnCreate = document.querySelector('.btn-primary');
       const btnDelete = document.querySelector('.btn-danger');

       btnCreate.addEventListener('click', (e) => {
          const table = document.createElement('table');
          const tbody = document.createElement('tbody');
          for(let i = 0; i < Number(rows.value); i++) {
            const tr = document.createElement('tr');
            for(let j = 0; j < Number(cols.value); j++){ 
                const td = document.createElement('td');
                td.innerText = (i + 1) + '.' + (j + 1);
                tr.append(td);
            }
            tbody.append(tr);
          }
          table.append(tbody);
          document.querySelector('#table-container').append(table);
          table.classList.add('table', 'table-bordered');
        });

        btnDelete.addEventListener('click', (e) => {
            if(!isNaN(parseInt(rows.value))){
                document.querySelector(`tr:nth-of-type(${rows.value})`).remove();
            }

            if(!isNaN(parseInt(cols.value))){
                document.querySelectorAll(`td:nth-of-type(${cols.value})`).forEach(item => {
                    item.remove();
                });
            }
        });
    });



  </script>
 
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col form-group mx-3">
              <label for="a1">Редове</label>
              <input type="text" class="form-control" id="a1" placeholder="Редове">
            </div>
            <div class="col form-group mx-3">
              <label for="b1">Колoни</label>
              <input type="text" class="form-control" id="b1" placeholder="Колони">
            </div>
        </div>
        <div class="row">
            <div class="form-group mx-3">
                <button type="button" class="btn btn-primary">Създай</button>
                <button type="button" class="btn btn-danger">Изтрий</button>
            </div>
        </div>
        <div class="row" id="table-container">
 
        </div>
    </div>
 
 
</body>
</html>
