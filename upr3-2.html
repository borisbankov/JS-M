<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        document.addEventListener('DOMContentLoaded', function(event){
            const field = document.querySelector('#input');
            const arr = document.querySelectorAll('.list-group-item');
            const btn = document.querySelector('#add');
            btn.addEventListener('click', (e) => {
                let num = Number.parseInt(field.value);
                const img = document.createElement('img');
                img.src = 'https://placehold.co/50x50';
                arr[num-1].append(img);

            });
     
        });
 
    </script>
</head>
<body>
    <div class="container my-4">
        <div class="col-lg-6 col-md-6">
            <input type="text" class="form-control" id="input" placeholder="въведете, позиция на която да се вмъкне изображение">
            <input type="button" class="btn btn-success add" id="add" value="Вмъкни">
            <ul class="list-group table-of-contents mt-4">
              <li class="list-group-item "><a href="#navbar" class="text-decoration-none">Navbar </a></li>
              <li class="list-group-item bg-info "><a href="#buttons" class="text-decoration-none text-white ">Buttons </a></li>
              <li class="list-group-item bg-warning "><a href="#typography" class="text-decoration-none text-white">Typography </a></li>
              <li class="list-group-item "><a href="#tables" class="text-decoration-none">Tables </a></li>
              <li class="list-group-item bg-danger"><a href="#forms" class="text-decoration-none text-white">Forms </a></li>
            </ul>
        </div>
    </div>
 
</body>
</html>
