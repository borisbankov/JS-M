      <script>
         document.addEventListener("DOMContentLoaded", function(event){
         
           function readTextFile(file, callback) {
             const rawFile = new XMLHttpRequest();
             rawFile.overrideMimeType("application/json; charset=UTF-8");
             rawFile.open("GET", file, true);
             rawFile.onreadystatechange = function() {
                 if (rawFile.readyState === 4 && rawFile.status == "200") {
                     callback(rawFile.responseText);
                 }
               }
               rawFile.send(null);
            }
            readTextFile("https://deepcloud.eu/tweets-en.json", function(text){
               const tweets = JSON.parse(text);
               console.log(tweets[0]);
               
               document.querySelector('.img-thumbnail').src = tweets[0].avatar;
               document.querySelector('.media-heading').innerText = tweets[0].name + ' ' + tweets[0].username;
               document.querySelector('p').innerText = tweets[0].text;

               let original = document.querySelector('.tweet');
               for(let i = 1; i < tweets.length; i++){
                  let copy = original.cloneNode(true);
                  copy.querySelector('.img-thumbnail').src = tweets[i].avatar;
                  copy.querySelector('.media-heading').innerText = tweets[i].name + ' ' + tweets[i].username;
                  copy.querySelector('p').innerText = i+'.' +tweets[i].text;
                  // original.after(copy);
                  original.parentNode.append(copy);
               }
               // 1 - 10 
               // 0 - 9 i -> p = 1
               // 11 - 20
               // 10 - 19 -> p = 2
               document.querySelectorAll('.page-link').forEach(item => {
                  item.addEventListener('click', (e) => {
                     let page = Number.parseInt(e.target.innerText);
                     document.querySelectorAll('.tweet').forEach((t, i) => {
                        if(i >= (page - 1) * 10  && i <= page * 10 - 1) {
                           t.classList.remove('d-none');
                        } else {
                           t.classList.add('d-none');
                        }
                     });
                     // let t = document.querySelectorAll('.tweet');
                     // for (let i = 0; i < t.length; i++) {
                     //    if(i >= (page - 1) * 10  && i <= page * 10 - 1) {
                     //       t[i].classList.remove('d-none');
                     //    } else {
                     //       t[i].classList.add('d-none');
                     //    }
                     // }
                     document.querySelector('.active').classList.remove('active');
                     e.target.parentNode.classList.add('active');
                  });
               });
            });
         }); 
      </script>
